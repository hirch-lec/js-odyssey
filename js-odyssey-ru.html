<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>JS Odyssey — изучай JavaScript, играя</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0e1a;--panel:#121829;--panel2:#182036;--line:#263052;--line2:#1b2340;
  --text:#e9edf7;--muted:#8a96b8;--js:#f7df1e;--jsd:#b9a40f;
  --good:#3ddc97;--goodd:#1f9e68;--bad:#ff5d73;--badd:#c0374c;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;
  --round:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--round);background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(1100px 600px at 8% -10%,rgba(247,223,30,.09),transparent 60%),
  radial-gradient(900px 600px at 110% 10%,rgba(179,136,255,.11),transparent 60%),
  radial-gradient(800px 500px at 50% 115%,rgba(76,201,240,.09),transparent 60%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:34px 34px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono)}
[hidden]{display:none!important}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

/* ---------- buttons ---------- */
.btn{--c:var(--js);--d:var(--jsd);--t:#1a1600;appearance:none;border:0;border-radius:14px;padding:14px 22px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:15px;color:var(--t);background:var(--c);box-shadow:0 5px 0 var(--d);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap;user-select:none}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d)}
.btn:disabled{--c:#262f4c;--d:#181f36;--t:#5f6a8c;cursor:not-allowed;filter:none}
.btn:disabled:active{transform:none;box-shadow:0 5px 0 var(--d)}
.btn.ghost{--c:var(--panel2);--d:#0c111e;--t:var(--text);box-shadow:0 5px 0 var(--d),inset 0 0 0 2px var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--d),inset 0 0 0 2px var(--line)}
.btn.good{--c:var(--good);--d:var(--goodd);--t:#03140c}
.btn.bad{--c:var(--bad);--d:var(--badd);--t:#fff}
.btn.sm{padding:11px 16px;font-size:13px}
.btn.big{padding:18px 40px;font-size:18px;border-radius:18px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:0;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;font-size:18px;display:grid;place-items:center;flex:none}
.icon-btn:active{transform:scale(.94)}
.link{background:none;border:0;color:var(--muted);cursor:pointer;font-weight:700;font-size:13px}
.link:hover{color:var(--text)}

/* ---------- title ---------- */
.title{min-height:100vh;display:grid;place-items:center;padding:32px 20px;position:relative;overflow:hidden}
.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floaters span{position:absolute;bottom:-60px;left:var(--x);font-family:var(--mono);font-weight:700;font-size:var(--s);color:var(--c);opacity:0;animation:drift var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes drift{0%{transform:translateY(0) rotate(-6deg);opacity:0}10%{opacity:.22}85%{opacity:.18}100%{transform:translateY(-115vh) rotate(8deg);opacity:0}}
.title-inner{position:relative;text-align:center;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:16px}
.logo .badge{width:84px;height:84px;border-radius:20px;background:var(--js);color:#111;font:900 40px/1 var(--round);display:flex;align-items:flex-end;justify-content:flex-end;padding:0 10px 8px 0;box-shadow:0 8px 0 var(--jsd),0 0 60px rgba(247,223,30,.35);transform:rotate(-6deg);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(-2deg) translateY(-6px)}}
.logo h1{font-size:clamp(46px,11vw,72px);font-weight:900;letter-spacing:-.02em;background:linear-gradient(180deg,#fff 20%,#b7c3e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--muted);font-size:17px;line-height:1.55}
.tag code{color:var(--js);background:rgba(247,223,30,.08);padding:1px 6px;border-radius:6px}
.title-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--panel2);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800;font-size:14px;white-space:nowrap}
.foot-note{color:#56618a;font-size:12px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(10,14,26,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
.topbar-in{max-width:760px;margin:0 auto;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.mini-logo{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;font-weight:900;font-size:18px}
.mini-logo i{font-style:normal;width:30px;height:30px;border-radius:8px;background:var(--js);color:#111;font-size:14px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 4px 2px 0;font-weight:900}
.grow{flex:1}

/* ---------- map ---------- */
.map{max-width:760px;margin:0 auto;padding:18px 16px 80px}
.tier{margin:18px 0 34px}
.tier-head{position:relative;border-radius:20px;padding:18px 18px 18px 20px;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 18%,var(--panel)),var(--panel));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--tc) 40%,transparent);display:flex;align-items:center;gap:14px;overflow:hidden}
.tier-head::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:var(--tc);opacity:.08}
.tier-ico{font-size:30px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(0,0,0,.25);flex:none}
.tier-head h2{font-size:20px;font-weight:900}
.tier-head h2 small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tc);font-weight:800;margin-bottom:2px}
.tier-head p{color:var(--muted);font-size:14px;margin-top:3px}
.tier-prog{margin-left:auto;text-align:right;font-weight:800;font-size:13px;color:var(--muted);flex:none;position:relative;z-index:1}
.tier-prog b{display:block;font-size:18px;color:var(--js)}
.tier.locked .tier-head{filter:grayscale(.8);opacity:.6}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0 6px}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(calc(var(--o) * 1px * var(--k,1)))}
.node{position:relative;width:78px;height:78px;border-radius:50%;border:0;cursor:pointer;font-size:32px;background:var(--tc);box-shadow:0 7px 0 var(--td),inset 0 -6px 0 rgba(0,0,0,.12),inset 0 4px 0 rgba(255,255,255,.25);transition:transform .12s}
.node:hover{transform:scale(1.05)}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--td)}
.node.boss{width:96px;height:96px;font-size:40px}
.node.boss::before{content:"БОСС";position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#ff3d5a;color:#fff;font-size:10px;font-weight:900;letter-spacing:.12em;padding:3px 8px;border-radius:999px;box-shadow:0 2px 0 #a71d33}
.node.locked{background:#283150;box-shadow:0 7px 0 #171d33,inset 0 -6px 0 rgba(0,0,0,.12);filter:grayscale(1);cursor:pointer}
.node.locked span{opacity:.35}
.node.current::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--tc);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
.start-flag{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:#fff;color:#111;font-size:12px;font-weight:900;letter-spacing:.08em;padding:6px 10px;border-radius:10px;white-space:nowrap;animation:hop 1.2s ease-in-out infinite;pointer-events:none}
.start-flag::after{content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes hop{50%{transform:translateX(-50%) translateY(-4px)}}
.node-title{font-weight:800;font-size:13px;color:var(--text);text-align:center;max-width:140px}
.node-wrap.is-locked .node-title{color:#566186}
.mini-stars{font-size:14px;letter-spacing:2px;color:#2f3a5e;line-height:1}
.mini-stars .on{color:var(--js);text-shadow:0 0 8px rgba(247,223,30,.5)}
.cert-card{margin:10px 0 0;border-radius:22px;padding:22px;text-align:center;background:linear-gradient(135deg,#2a2208,#121829 60%);box-shadow:inset 0 0 0 2px rgba(247,223,30,.35);display:flex;flex-direction:column;align-items:center;gap:12px}
.cert-card.locked{background:var(--panel);box-shadow:inset 0 0 0 2px var(--line)}
.cert-card .big-ico{font-size:46px}
.cert-card p{color:var(--muted)}
.pbar{width:100%;max-width:340px;height:12px;border-radius:99px;background:var(--line2);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--js),#ffb703);border-radius:99px;transition:width .6s}

/* ---------- level ---------- */
.level{min-height:100vh;padding-bottom:140px}
.lvl-top{position:sticky;top:0;z-index:20;background:rgba(10,14,26,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lvl-top-in{max-width:760px;margin:0 auto;padding:12px 16px 8px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.bar{flex:1;height:16px;border-radius:99px;background:var(--line2);overflow:hidden;position:relative}
.bar .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--tc),color-mix(in srgb,var(--tc) 60%,#fff));transition:width .5s cubic-bezier(.3,1.4,.5,1);position:relative}
.bar .fill::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.hearts{display:flex;gap:2px}
.hearts svg{width:26px;height:26px;fill:#ff4d6d;filter:drop-shadow(0 2px 0 #a3203a);transition:transform .3s}
.hearts svg.lost{fill:#2b3352;filter:none;transform:scale(.85)}
.hearts svg.breaking{animation:heartbreak .6s}
@keyframes heartbreak{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-12deg);fill:#ff4d6d}100%{transform:scale(.85)}}
.lvl-sub{max-width:760px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl-name{font-weight:800;color:var(--muted);font-size:14px;margin-right:auto}
.lvl-name b{color:var(--tc)}
.chip.timer.urgent{background:#3a1220;box-shadow:inset 0 0 0 1.5px var(--bad);color:#ffb3bf;animation:throb .5s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.08)}}
.chip.hot{background:#3a2208;box-shadow:inset 0 0 0 1.5px #ff8c42;color:#ffc58f}
.task-wrap{max-width:760px;margin:0 auto;padding:8px 16px}
.card{background:var(--panel);border-radius:22px;padding:22px;box-shadow:inset 0 0 0 1.5px var(--line),0 20px 50px rgba(0,0,0,.25)}
.enter{animation:slideIn .38s cubic-bezier(.2,1.2,.4,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.task-type{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--tc);margin-bottom:10px}
.again{color:#ffb703;background:rgba(255,183,3,.1);padding:4px 8px;border-radius:8px;letter-spacing:.06em}
.task-q{font-size:20px;line-height:1.4;font-weight:800;margin-bottom:16px}
.task-q code,.exp code,.brief code,.hintbox code,.toast code{font-size:.9em;background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px;color:#ffe873}
pre.code{background:#0b1020;border-radius:14px;padding:16px 18px;overflow:auto;font:15px/1.65 var(--mono);white-space:pre;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:16px;tab-size:2}
.c-kw{color:#c792ea}.c-str{color:#c3e88d}.c-num{color:#f78c6c}.c-com{color:#5f6d92;font-style:italic}.c-fn{color:#82aaff}.c-lit{color:#ff9cac}.c-cls{color:#ffcb6b}.c-op{color:#89ddff}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:var(--panel2);border:0;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line2);font:600 16px var(--mono);cursor:pointer;transition:transform .08s,box-shadow .15s,background .15s}
.opt:hover{background:#1d2742}
.opt:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--line2)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:800 13px var(--round);background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.opt.sel{background:rgba(76,201,240,.1);box-shadow:inset 0 0 0 2px #4cc9f0,0 4px 0 #1f7c99}
.opt.sel .k{background:#4cc9f0;color:#032;box-shadow:none}
.opt.right{background:rgba(61,220,151,.12);box-shadow:inset 0 0 0 2px var(--good),0 4px 0 var(--goodd)}
.opt.right .k{background:var(--good);color:#032;box-shadow:none}
.opt.wrong{background:rgba(255,93,115,.12);box-shadow:inset 0 0 0 2px var(--bad),0 4px 0 var(--badd)}
.opt.wrong .k{background:var(--bad);color:#fff;box-shadow:none}
.opts.locked .opt{pointer-events:none}
.blank{font:inherit;background:rgba(247,223,30,.1);border:0;border-bottom:2px dashed var(--js);color:var(--js);text-align:center;outline:none;border-radius:6px 6px 0 0;padding:0 4px;min-width:4ch}
.blank:focus{background:rgba(247,223,30,.18)}
.blank.right{color:var(--good);border-color:var(--good);background:rgba(61,220,151,.12)}
.blank.wrong{color:var(--bad);border-color:var(--bad);background:rgba(255,93,115,.12)}
.hintbox{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(255,183,3,.08);box-shadow:inset 0 0 0 1.5px rgba(255,183,3,.35);color:#ffe2a8;font-size:15px;line-height:1.5;animation:slideIn .3s}
/* order */
.order-zone{min-height:120px;border-radius:16px;padding:10px;background:#0b1020;box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.order-empty{color:#4b5679;font-size:14px;text-align:center;margin:auto;padding:16px}
.order-label{text-align:center;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:12px 0 8px}
.order-pool{display:flex;flex-direction:column;gap:8px}
.ln{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:12px;padding:10px 12px;background:var(--panel2);box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--line2);cursor:pointer;font:14.5px/1.4 var(--mono);white-space:pre;overflow-x:auto;animation:pop .22s}
.ln:active{transform:translateY(2px)}
.ln code{white-space:pre}
.ln.placed{background:#121a30;box-shadow:inset 0 0 0 1px var(--line)}
.ln .ln-n{flex:none;width:20px;color:#4b5679;font-size:12px;text-align:right}
.ln.right{box-shadow:inset 0 0 0 1.5px var(--good)}
.ln.wrong{box-shadow:inset 0 0 0 1.5px var(--bad);background:rgba(255,93,115,.08)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
/* editor */
.editor-tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--muted);font-size:13px}
.editor{position:relative;height:270px;border-radius:14px;background:#0b1020;box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.editor:focus-within{box-shadow:inset 0 0 0 2px var(--tc)}
.editor pre,.editor textarea{position:absolute;inset:0;margin:0;padding:14px 16px;border:0;font:15px/1.6 var(--mono);letter-spacing:0;white-space:pre;word-wrap:normal;overflow-wrap:normal;tab-size:2;-moz-tab-size:2}
.editor pre{pointer-events:none;overflow:hidden;color:var(--text)}
.editor textarea{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--js);resize:none;outline:none;overflow:auto}
.editor textarea::selection{background:rgba(130,170,255,.3);-webkit-text-fill-color:transparent}
.keys{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.key{flex:none;min-width:40px;padding:9px 10px;border-radius:10px;border:0;background:var(--panel2);box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--line2);font:700 15px var(--mono);cursor:pointer;touch-action:pan-x}
.key:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line)}
.tests{margin-top:14px;display:grid;gap:6px}
.tests h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.test{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;background:#0d1324;font:13.5px/1.45 var(--mono);box-shadow:inset 0 0 0 1px var(--line2);transition:background .2s}
.test .ti{flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font:900 12px var(--round);background:var(--line);color:var(--muted)}
.test.pass{background:rgba(61,220,151,.07);box-shadow:inset 0 0 0 1px rgba(61,220,151,.4)}
.test.pass .ti{background:var(--good);color:#032}
.test.fail{background:rgba(255,93,115,.07);box-shadow:inset 0 0 0 1px rgba(255,93,115,.4)}
.test.fail .ti{background:var(--bad);color:#fff}
.test .tx{min-width:0;overflow-wrap:anywhere}
.test .got{color:#ff9cac;display:block}
.test .exp-v{color:var(--muted)}
.tests.running .test{animation:scan 1s infinite}
@keyframes scan{50%{opacity:.5}}
.console{margin-top:10px;border-radius:12px;background:#05080f;padding:10px 12px;font:13px/1.5 var(--mono);color:#a9b4d6;max-height:140px;overflow:auto;box-shadow:inset 0 0 0 1px var(--line2)}
.console b{color:#5f6d92;font-weight:400}
.err-box{margin-top:10px;border-radius:12px;padding:10px 12px;background:rgba(255,93,115,.08);box-shadow:inset 0 0 0 1px rgba(255,93,115,.4);color:#ffb3bf;font:13.5px/1.5 var(--mono);overflow-wrap:anywhere}
/* actions + sheet */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(transparent,rgba(10,14,26,.95) 30%);padding:26px 16px max(16px,env(safe-area-inset-bottom))}
.actions-in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.actions-in .btn:last-child{min-width:150px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,1.1,.4,1);padding:18px 16px max(18px,env(safe-area-inset-bottom));border-top:3px solid}
.sheet.show{transform:none}
.sheet.ok{background:#0e2b20;border-color:var(--good)}
.sheet.no{background:#2d1119;border-color:var(--bad)}
.sheet-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px;max-height:62vh}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;flex:none}
.sheet.ok .ico{background:var(--good);color:#032}
.sheet.no .ico{background:var(--bad);color:#fff}
.sheet h3{font-size:22px;font-weight:900}
.sheet.ok h3{color:var(--good)}
.sheet.no h3{color:#ff8ea0}
.exp{color:#d5dcef;line-height:1.55;font-size:15.5px;overflow:auto}
.exp pre.code{margin:8px 0 4px;font-size:13.5px}
.sheet .btn{align-self:stretch}
@media(min-width:600px){.sheet .btn{align-self:flex-end;min-width:200px}}

/* ---------- modal ---------- */
#modal:empty{display:none}
.modal-wrap{position:fixed;inset:0;z-index:60;background:rgba(4,6,14,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(100%,440px);background:var(--panel);border-radius:26px;padding:28px 24px 24px;text-align:center;box-shadow:inset 0 0 0 1.5px var(--line),0 30px 80px rgba(0,0,0,.5);animation:popIn .4s cubic-bezier(.2,1.5,.4,1);max-height:92vh;overflow:auto}
@keyframes popIn{from{transform:scale(.85) translateY(20px);opacity:0}}
.modal h2{font-size:26px;font-weight:900;margin:6px 0 8px}
.modal p{color:var(--muted);line-height:1.55}
.m-ico{width:84px;height:84px;margin:0 auto 6px;border-radius:24px;display:grid;place-items:center;font-size:42px;background:var(--tc);box-shadow:0 7px 0 var(--td)}
.m-tier{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--tc);margin-top:14px}
.brief{text-align:left;background:var(--panel2);border-radius:16px;padding:14px 16px;margin:14px 0;color:#c9d1ea!important;font-size:15px;box-shadow:inset 0 0 0 1px var(--line)}
.m-meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:6px}
.m-btns{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.m-btns .btn{flex:1;min-width:120px}
.r-title{font-size:30px;font-weight:900;background:linear-gradient(180deg,#fff,var(--js));-webkit-background-clip:text;background-clip:text;color:transparent}
.r-stars{display:flex;justify-content:center;gap:6px;margin:16px 0 6px}
.rs{font-size:64px;line-height:1;color:#263052;display:inline-block;transform:scale(.6);transition:transform .2s}
.rs:nth-child(2){font-size:80px;margin-top:-14px}
.rs.on{color:var(--js);text-shadow:0 0 30px rgba(247,223,30,.6),0 5px 0 var(--jsd);animation:starPop .5s cubic-bezier(.2,1.8,.4,1) forwards}
.rs.off{transform:scale(.85)}
@keyframes starPop{0%{transform:scale(.2) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.r-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:16px}
.r-stats div{background:var(--panel2);border-radius:14px;padding:12px 8px;box-shadow:inset 0 0 0 1px var(--line)}
.r-stats b{display:block;font-size:22px;font-weight:900;color:var(--js)}
.r-stats span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.unlock{margin-top:14px;padding:12px;border-radius:14px;background:rgba(61,220,151,.1);box-shadow:inset 0 0 0 1.5px var(--good);color:var(--good);font-weight:800;animation:popIn .5s cubic-bezier(.2,1.5,.4,1)}
.f-ico{font-size:64px;animation:popIn .5s}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--panel2);margin-top:10px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;border:0;width:100%;font-weight:800;font-size:16px}
.sw{width:48px;height:28px;border-radius:99px;background:#2b3352;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.toggle.on .sw{background:var(--good)}
.toggle.on .sw::after{transform:translateX(20px)}

/* ---------- certificate ---------- */
.cert-wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.cert-wrap h1{font-size:clamp(28px,6vw,40px);font-weight:900}
.cert-wrap>p{color:var(--muted)}
.name-input{width:min(100%,460px);padding:16px 18px;border-radius:16px;border:0;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line);color:var(--text);font:700 20px var(--round);text-align:center;outline:none}
.name-input:focus{box-shadow:inset 0 0 0 2px var(--js)}
.cert-frame{width:100%;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);animation:popIn .6s cubic-bezier(.2,1.3,.4,1)}
.cert-frame canvas{display:block;width:100%;height:auto}
.locked-cert{max-width:480px;margin:40px auto;text-align:center;padding:0 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--js) calc(var(--p)*1%),var(--line2) 0);display:grid;place-items:center}
.ring div{width:120px;height:120px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:44px}
.tier-list{width:100%;display:grid;gap:8px;margin-top:6px}
.tier-list div{display:flex;justify-content:space-between;padding:12px 16px;border-radius:14px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-weight:800}
.tier-list span{color:var(--muted)}
.tier-list .done span{color:var(--good)}

/* ---------- toast / float ---------- */
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:#1b2440;box-shadow:inset 0 0 0 1.5px var(--line),0 10px 30px rgba(0,0,0,.4);padding:11px 16px;border-radius:14px;font-weight:800;font-size:14px;animation:toastIn .3s cubic-bezier(.2,1.4,.4,1)}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{transform:translateY(20px) scale(.9);opacity:0}}
@keyframes toastOut{to{transform:translateY(-10px);opacity:0}}
.float{position:fixed;z-index:85;font-weight:900;font-size:22px;color:var(--js);text-shadow:0 2px 0 #6b5c00,0 0 20px rgba(247,223,30,.6);pointer-events:none;animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-14px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}

@media(max-width:600px){
  .node-wrap{--k:.62}
  .task-q{font-size:18px}
  pre.code{font-size:14px;padding:14px}
  .editor pre,.editor textarea{font-size:16px}
  .editor{height:240px}
  .card{padding:18px 16px}
  .tier-head p{display:none}
  .actions-in .btn:last-child{min-width:0;flex:1}
  .actions-in .lbl{display:none}
  .actions-in .btn{padding-left:14px;padding-right:14px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   DATA — tiers & levels
   ===================================================================== */
const TIERS = [
{"name":"Новичок","icon":"🌱","c":"#3ddc97","d":"#1f9e68","desc":"Переменные, типы, операторы и условия"},
{"name":"Ученик","icon":"⚙️","c":"#4cc9f0","d":"#1f7c99","desc":"Массивы, циклы, функции и объекты"},
{"name":"Адепт","icon":"🔮","c":"#b388ff","d":"#7546c9","desc":"Функции высшего порядка, замыкания и классы"},
{"name":"Эксперт","icon":"🔥","c":"#ff8c42","d":"#b85718","desc":"Асинхронность, приведение типов, прототипы и рекурсия"}
];

const LEVELS = [
{"tier":0,"icon":"📦","title":"Переменные и типы","brief":"Переменные — это подписанные коробки для значений. Используйте `const` для значений, которые не будут переприсваиваться, и `let` — для тех, что будут меняться. У каждого значения есть тип: string, number, boolean, null, undefined, object…","tasks":[{"type":"quiz","q":"Что будет выведено?","code":"let x = 5;\nx = x + 2;\nconsole.log(x);","opts":["7","5","52","Ошибка"],"exp":"`let` создаёт переменную, которую можно переприсвоить. Сначала вычисляется правая часть `x + 2` (7), затем результат записывается обратно в `x`.","hint":"Сначала выполняется правая часть от `=`, потом результат сохраняется."},{"type":"fill","q":"Объявите значение, которое нельзя переприсвоить.","code":"___ PI = 3.14159;\nPI = 3; // ❌ TypeError!","answers":["const"],"exp":"`const` создаёт привязку, которую нельзя переприсвоить. Используйте его по умолчанию, а `let` — только когда значение должно меняться.","hint":"Пять букв, сокращение от «constant»."},{"type":"quiz","q":"Что выведет этот код?","code":"console.log(typeof \"42\");","opts":["\"string\"","\"number\"","\"text\"","\"object\""],"exp":"Всё, что в кавычках, — строка, даже если похоже на число. `typeof` всегда возвращает строку с названием типа.","hint":"Посмотрите внимательно на кавычки вокруг 42."}]},
{"tier":0,"icon":"➗","title":"Операторы и функции","brief":"Арифметические операторы (`+ - * / %`) подчиняются математическому порядку действий. Функции упаковывают логику для повторного использования: принимают параметры и возвращают результат через `return`.","tasks":[{"type":"quiz","q":"Что будет выведено?","code":"console.log(10 % 3);","opts":["1","3","3.33","0"],"exp":"`%` — оператор остатка от деления. 10 ÷ 3 = 3, остаток 1.","hint":"Подумайте, что «остаётся» после деления."},{"type":"quiz","q":"Что будет выведено?","code":"console.log(2 + 3 * 4);","opts":["14","20","24","9"],"exp":"Умножение выполняется раньше сложения, поэтому сначала `3 * 4`: 2 + 12 = 14.","hint":"Вспомните порядок действий из школьной математики."},{"type":"code","q":"Напишите функцию `double(n)`, которая возвращает `n`, умноженное на 2.","fn":"double(n)","starter":"function double(n) {\n  // ваш код здесь\n}","tests":[{"e":"double(2)","v":4},{"e":"double(0)","v":0},{"e":"double(-5)","v":-10},{"e":"double(1.5)","v":3}],"solution":"function double(n) {\n  return n * 2;\n}","exp":"`return` возвращает значение тому, кто вызвал функцию. Без него функция возвращает `undefined`.","hint":"Используйте ключевое слово `return` и выражение `n * 2`."}]},
{"tier":0,"icon":"🔤","title":"Строки","brief":"Строки — это текст в кавычках. `+` склеивает строки, `.length` считает символы, а шаблонные строки (обратные кавычки) встраивают значения через `${…}`.","tasks":[{"type":"quiz","q":"Что будет выведено?","code":"console.log(\"5\" + 3);","opts":["\"53\"","8","NaN","Ошибка"],"exp":"Если с одной из сторон `+` стоит строка, он склеивает (конкатенирует), а не складывает. 3 превращается в \"3\", получается \"53\".","hint":"У `+` две работы: складывать числа и склеивать строки."},{"type":"fill","q":"Получите количество символов в строке.","code":"const word = \"hello\";\nconsole.log(word.___); // 5","answers":["length"],"exp":"`.length` — это свойство (без скобок), в котором хранится число символов строки. У массивов оно тоже есть!","hint":"Это свойство, а не метод — без `()`."},{"type":"code","q":"Напишите `greet(name)`, которая возвращает приветствие, например `greet(\"Ада\")` → `\"Привет, Ада!\"`","fn":"greet(name)","starter":"function greet(name) {\n  \n}","tests":[{"e":"greet(\"Ада\")","v":"Привет, Ада!"},{"e":"greet(\"JS\")","v":"Привет, JS!"},{"e":"greet(\"мир\")","v":"Привет, мир!"}],"solution":"function greet(name) {\n  return `Привет, ${name}!`;\n}","exp":"Шаблонные строки используют обратные кавычки и подстановки `${…}`. Вариант `\"Привет, \" + name + \"!\"` тоже работает.","hint":"Склейте \"Привет, \" + name + \"!\" — не забудьте запятую, пробел и восклицательный знак."}]},
{"tier":0,"icon":"🔀","title":"Условия","brief":"`if` / `else` позволяет коду принимать решения. Для сравнения используйте строгое равенство (`===`) — оно проверяет и значение, и тип.","tasks":[{"type":"quiz","q":"Что будет выведено (по порядку)?","code":"console.log(5 === \"5\");\nconsole.log(5 == \"5\");","opts":["false, затем true","true, затем true","false, затем false","true, затем false"],"exp":"`===` сравнивает значение И тип: число и строка → false. `==` сначала приводит типы, \"5\" становится 5 → true. Предпочитайте `===`.","hint":"Один из операторов проверяет тип, другой — нет."},{"type":"code","q":"Напишите `isEven(n)`, которая возвращает `true`, если `n` чётное, и `false` в остальных случаях.","fn":"isEven(n)","starter":"function isEven(n) {\n  \n}","tests":[{"e":"isEven(4)","v":true},{"e":"isEven(7)","v":false},{"e":"isEven(0)","v":true},{"e":"isEven(-3)","v":false}],"solution":"function isEven(n) {\n  return n % 2 === 0;\n}","exp":"Число чётное, если при делении на 2 нет остатка: `n % 2 === 0`. Сравнение уже даёт true/false, его можно вернуть напрямую.","hint":"Используйте оператор `%` из прошлого уровня."},{"type":"order","q":"Расставьте строки так, чтобы взрослые (18+) видели \"Взрослый\", а все остальные — \"Несовершеннолетний\".","lines":["const age = 20;","if (age >= 18) {","  console.log(\"Взрослый\");","} else {","  console.log(\"Несовершеннолетний\");","}"],"exp":"Объявляйте переменные до использования. Блок `if` выполняется, когда условие истинно; `else` ловит все остальные случаи.","hint":"Начните с переменной, затем `if`."}]},
{"tier":0,"icon":"👑","title":"Испытание новичка","boss":true,"time":180,"brief":"Всё из ранга «Новичок» — на время. Читайте внимательно и остерегайтесь причуд типов!","tasks":[{"type":"quiz","q":"Что будет выведено?","code":"const a = \"3\";\nconst b = 4;\nconsole.log(a * b);","opts":["12","\"34\"","NaN","\"12\""],"exp":"В отличие от `+`, оператор `*` умеет только считать, поэтому превращает \"3\" в число 3. Результат: 12 (число).","hint":"У `*` нет режима склеивания строк."},{"type":"quiz","q":"Что будет выведено?","code":"console.log(typeof null);","opts":["\"object\"","\"null\"","\"undefined\"","null"],"exp":"Знаменитая ошибка 1995 года, которую нельзя исправить, не сломав веб: `typeof null` — это \"object\". Проверяйте null через `value === null`.","hint":"Это историческая причуда языка."},{"type":"code","q":"Напишите `max3(a, b, c)`, которая возвращает наибольшее из трёх чисел.","fn":"max3(a, b, c)","starter":"function max3(a, b, c) {\n  \n}","tests":[{"e":"max3(1, 5, 3)","v":5},{"e":"max3(9, 2, 4)","v":9},{"e":"max3(-1, -7, -3)","v":-1},{"e":"max3(2, 2, 8)","v":8}],"solution":"function max3(a, b, c) {\n  return Math.max(a, b, c);\n}","exp":"`Math.max` принимает любое количество аргументов. Можно также сравнить через цепочку `if` / `else`.","hint":"У встроенного объекта `Math` есть подходящий метод."},{"type":"fill","q":"Вызовите `pass()`, когда score равен 50 **или больше**.","code":"if (score ___ 50) {\n  pass();\n}","answers":[">="],"exp":"`>=` означает «больше или равно». С одним `>` результат ровно 50 не прошёл бы.","hint":"Два символа: знак сравнения плюс знак равенства."}]},
{"tier":1,"icon":"🧺","title":"Массивы","brief":"Массивы — упорядоченные списки с индексами от 0. `push` добавляет элемент в конец, а `length` показывает количество элементов.","tasks":[{"type":"quiz","q":"Что будет выведено?","code":"const arr = [10, 20, 30];\nconsole.log(arr[1]);","opts":["20","10","30","undefined"],"exp":"Индексы массивов начинаются с нуля: `arr[0]` — это 10, `arr[1]` — 20.","hint":"Счёт начинается с 0."},{"type":"fill","q":"Добавьте `3` в конец массива.","code":"const nums = [1, 2];\nnums.___(3);\nconsole.log(nums); // [1, 2, 3]","answers":["push"],"exp":"`push` добавляет элементы в конец массива (и возвращает новую длину). `unshift` добавляет в начало.","hint":"Четыре буквы. Так «заталкивают» элементы в стек."},{"type":"code","q":"Напишите `last(arr)`, которая возвращает последний элемент массива (или `undefined`, если он пуст).","fn":"last(arr)","starter":"function last(arr) {\n  \n}","tests":[{"e":"last([1, 2, 3])","v":3},{"e":"last([\"a\"])","v":"a"},{"e":"last([])","v":undefined}],"solution":"function last(arr) {\n  return arr[arr.length - 1];\n}","exp":"Последний индекс всегда `length - 1`. В современном JS есть и `arr.at(-1)`.","hint":"Если в массиве 3 элемента, какой индекс у последнего?"}]},
{"tier":1,"icon":"🔁","title":"Циклы","brief":"Циклы повторяют работу. У цикла `for` три части — начало; условие; шаг. Цикл `while` работает, пока условие истинно.","tasks":[{"type":"quiz","q":"Что будет выведено?","code":"let sum = 0;\nfor (let i = 1; i <= 4; i++) {\n  sum += i;\n}\nconsole.log(sum);","opts":["10","6","15","4"],"exp":"`i` принимает значения 1, 2, 3, 4 (обратите внимание на `<=`). 1 + 2 + 3 + 4 = 10.","hint":"Выпишите все значения `i` и сложите их."},{"type":"quiz","q":"Сколько раз будет выведено \"hi\"?","code":"for (let i = 0; i < 10; i += 3) {\n  console.log(\"hi\");\n}","opts":["4","3","10","9"],"exp":"`i` принимает 0, 3, 6, 9 — четыре значения меньше 10. Следующее было бы 12, и условие уже не выполнится.","hint":"Выпишите значения `i`."},{"type":"code","q":"Напишите `sumTo(n)`, которая возвращает 1 + 2 + … + n (и 0, если n равно 0).","fn":"sumTo(n)","starter":"function sumTo(n) {\n  let total = 0;\n  \n  return total;\n}","tests":[{"e":"sumTo(1)","v":1},{"e":"sumTo(5)","v":15},{"e":"sumTo(100)","v":5050},{"e":"sumTo(0)","v":0}],"solution":"function sumTo(n) {\n  let total = 0;\n  for (let i = 1; i <= n; i++) {\n    total += i;\n  }\n  return total;\n}","exp":"Пройдите циклом от 1 до n, прибавляя каждое число к сумме. (Для любителей математики: `n * (n + 1) / 2` тоже работает!)","hint":"`for (let i = 1; i <= n; i++) { total += i; }`"}]},
{"tier":1,"icon":"🧩","title":"Функции подробнее","brief":"У функций бывают параметры по умолчанию, а стрелочные функции (`=>`) дают компактный синтаксис для небольших помощников.","tasks":[{"type":"quiz","q":"Что будет выведено?","code":"function area(w, h = 2) {\n  return w * h;\n}\nconsole.log(area(5));","opts":["10","NaN","5","undefined"],"exp":"`h = 2` — параметр по умолчанию: он используется, когда аргумент не передан. 5 × 2 = 10.","hint":"Какое значение получает `h`, если его не передали?"},{"type":"fill","q":"Допишите стрелочную функцию.","code":"const square = (x) ___ x * x;\nconsole.log(square(4)); // 16","answers":["=>"],"exp":"Стрелочные функции используют `=>`. Если тело — одно выражение, значение возвращается автоматически: не нужны ни `return`, ни фигурные скобки.","hint":"Похоже на стрелку: знак равенства + «больше»."},{"type":"code","q":"Напишите `countVowels(str)`, которая считает латинские гласные a, e, i, o, u (в любом регистре).","fn":"countVowels(str)","starter":"function countVowels(str) {\n  \n}","tests":[{"e":"countVowels(\"hello\")","v":2},{"e":"countVowels(\"JAVASCRIPT\")","v":3},{"e":"countVowels(\"rhythm\")","v":0},{"e":"countVowels(\"\")","v":0}],"solution":"function countVowels(str) {\n  let count = 0;\n  for (const ch of str.toLowerCase()) {\n    if (\"aeiou\".includes(ch)) count++;\n  }\n  return count;\n}","exp":"Приведите регистр через `toLowerCase()`, переберите символы через `for…of` и проверьте вхождение через `includes`. Регулярное выражение тоже подойдёт: `(str.match(/[aeiou]/gi) || []).length`.","hint":"`\"aeiou\".includes(ch)` подскажет, гласная ли это."}]},
{"tier":1,"icon":"🗂️","title":"Объекты","brief":"Объекты хранят пары ключ → значение. Обращайтесь к значениям через точку или квадратные скобки, а ключи перебирайте через `for…in` или `Object.keys`.","tasks":[{"type":"quiz","q":"Что будет выведено?","code":"const user = { name: \"Ada\" };\nuser.age = 36;\nconsole.log(Object.keys(user).length);","opts":["2","1","undefined","TypeError"],"exp":"`const` запрещает переприсваивать `user`, но сам объект изменять можно. После добавления `age` у него 2 ключа.","hint":"`const` ≠ неизменяемость."},{"type":"fill","q":"Переберите все ключи объекта.","code":"const scores = { ana: 9, bo: 7 };\nfor (const key ___ scores) {\n  console.log(key, scores[key]);\n}","answers":["in"],"exp":"`for…in` перебирает ключи объекта. `for…of` перебирает значения итерируемых объектов вроде массивов — а обычные объекты не итерируемы!","hint":"Две буквы. Не `of`!"},{"type":"code","q":"Напишите `invert(obj)`, которая меняет местами ключи и значения: `{a: \"x\"}` → `{x: \"a\"}`.","fn":"invert(obj)","starter":"function invert(obj) {\n  const result = {};\n  \n  return result;\n}","tests":[{"e":"invert({ a: \"x\", b: \"y\" })","v":{"x":"a","y":"b"}},{"e":"invert({})","v":{}},{"e":"invert({ one: \"1\" })","v":{"1":"one"}}],"solution":"function invert(obj) {\n  const result = {};\n  for (const key in obj) {\n    result[obj[key]] = key;\n  }\n  return result;\n}","exp":"Переберите ключи и используйте значение как новый ключ через квадратные скобки: `result[obj[key]] = key`. Однострочник: `Object.fromEntries(Object.entries(obj).map(([k, v]) => [v, k]))`.","hint":"Квадратные скобки позволяют использовать переменную как ключ: `result[value] = key`."}]},
{"tier":1,"icon":"👑","title":"Испытание ученика","boss":true,"time":240,"brief":"Массивы, циклы, функции и объекты сталкиваются. Помните: объекты и массивы передаются по ссылке!","tasks":[{"type":"quiz","q":"Что будет выведено?","code":"const a = [1, 2, 3];\nconst b = a;\nb.push(4);\nconsole.log(a.length);","opts":["4","3","undefined","Ошибка"],"exp":"Массивы — это объекты, и хранятся они по ссылке. `b = a` копирует ссылку, а не массив: оба имени указывают на один список. Для настоящей копии используйте `[...a]`.","hint":"`b` — это копия или другое имя для того же самого?"},{"type":"order","q":"Соберите из строк рабочую функцию `findMax`.","lines":["function findMax(arr) {","  let max = arr[0];","  for (const n of arr) {","    if (n > max) max = n;","  }","  return max;","}"],"exp":"Начните с кандидата (`arr[0]`), сравните его с каждым элементом, оставьте больший и верните результат после окончания цикла.","hint":"`return` должен идти после закрытия цикла."},{"type":"code","q":"Напишите `fizzBuzz(n)`: верните \"Fizz\" для кратных 3, \"Buzz\" для кратных 5, \"FizzBuzz\" для кратных обоим, иначе — число в виде строки.","fn":"fizzBuzz(n)","starter":"function fizzBuzz(n) {\n  \n}","tests":[{"e":"fizzBuzz(3)","v":"Fizz"},{"e":"fizzBuzz(10)","v":"Buzz"},{"e":"fizzBuzz(15)","v":"FizzBuzz"},{"e":"fizzBuzz(7)","v":"7"},{"e":"fizzBuzz(30)","v":"FizzBuzz"}],"solution":"function fizzBuzz(n) {\n  if (n % 15 === 0) return \"FizzBuzz\";\n  if (n % 3 === 0) return \"Fizz\";\n  if (n % 5 === 0) return \"Buzz\";\n  return String(n);\n}","exp":"Сначала проверяйте самый специфичный случай (кратность 15) — иначе для 15 раньше вернётся \"Fizz\". `String(n)` превращает число в строку.","hint":"Порядок важен: проверьте 15 раньше 3 и 5."},{"type":"quiz","q":"Что будет выведено?","code":"console.log([1, 2, 3].includes(\"2\"));","opts":["false","true","1","undefined"],"exp":"`includes` использует строгое сравнение: строка \"2\" — это не число 2.","hint":"Сравните типы элементов и искомого значения."}]},
{"tier":2,"icon":"⚡","title":"Map, filter, reduce","brief":"`map` преобразует, `filter` отбирает, `reduce` сводит к одному значению. Они возвращают новые значения, а не изменяют старые, — это сердце функционального JS.","tasks":[{"type":"quiz","q":"Что будет выведено?","code":"const out = [1, 2, 3].map(x => x * 2);\nconsole.log(out);","opts":["[2, 4, 6]","[1, 2, 3]","12","[2, 4, 6, 8]"],"exp":"`map` создаёт НОВЫЙ массив, преобразуя каждый элемент. Исходный массив не меняется.","hint":"Один выходной элемент на каждый входной."},{"type":"fill","q":"Оставьте только чётные числа.","code":"const nums = [1, 2, 3, 4, 5, 6];\nconst evens = nums.___(n => n % 2 === 0);\n// [2, 4, 6]","answers":["filter"],"exp":"`filter` оставляет элементы, для которых колбэк вернул true, и создаёт новый (возможно, более короткий) массив.","hint":"Вы отфильтровываете нечётные…"},{"type":"code","q":"Напишите `total(prices)`, которая возвращает сумму чисел массива (0 для пустого массива). Попробуйте `reduce`!","fn":"total(prices)","starter":"function total(prices) {\n  \n}","tests":[{"e":"total([1, 2, 3])","v":6},{"e":"total([])","v":0},{"e":"total([10.5, 4.5])","v":15}],"solution":"function total(prices) {\n  return prices.reduce((sum, p) => sum + p, 0);\n}","exp":"`reduce((acc, x) => acc + x, 0)` сворачивает массив в одно значение. Всегда передавайте начальное значение (`0`) — без него `reduce` на пустом массиве выбросит ошибку!","hint":"`prices.reduce((sum, p) => sum + p, 0)`"}]},
{"tier":2,"icon":"🔐","title":"Области видимости и замыкания","brief":"Замыкание — это функция, которая помнит переменные из места, где была создана. У `let` блочная область видимости, у `var` — функциональная.","tasks":[{"type":"quiz","q":"Что будет выведено?","code":"function counter() {\n  let c = 0;\n  return () => ++c;\n}\nconst next = counter();\nnext();\nnext();\nconsole.log(next());","opts":["3","1","2","0"],"exp":"Стрелочная функция замыкает `c`, и переменная живёт между вызовами. Каждый вызов увеличивает тот же `c`: 1, 2, затем 3.","hint":"`c` не сбрасывается между вызовами `next`."},{"type":"quiz","q":"Что будет выведено?","code":"for (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 0);\n}","opts":["3 3 3","0 1 2","2 2 2","0 0 0"],"exp":"У `var` функциональная область видимости, поэтому все три колбэка разделяют ОДНУ `i`. Когда они выполняются, цикл уже закончился и `i` равна 3. С `let` получится 0 1 2 — `let` создаёт новую привязку на каждой итерации.","hint":"Когда на самом деле выполняются колбэки — и чему тогда равна `i`?"},{"type":"code","q":"Напишите `makeMultiplier(n)`, которая возвращает функцию, умножающую свой аргумент на `n`.","fn":"makeMultiplier(n)","starter":"function makeMultiplier(n) {\n  \n}","tests":[{"e":"makeMultiplier(3)(4)","v":12},{"e":"makeMultiplier(10)(-2)","v":-20},{"t":"const dbl = makeMultiplier(2); [dbl(1), dbl(5)]","e":"(() => { const dbl = makeMultiplier(2); return [dbl(1), dbl(5)]; })()","v":[2,10]}],"solution":"function makeMultiplier(n) {\n  return (x) => x * n;\n}","exp":"Возвращаемая функция «замыкает» `n` и помнит его даже после завершения `makeMultiplier`. Это фабрика функций.","hint":"Верните функцию: `return (x) => …`"}]},
{"tier":2,"icon":"🎁","title":"Деструктуризация и spread","brief":"Деструктуризация распаковывает массивы и объекты в переменные. Spread (`...`) копирует или объединяет их одним движением.","tasks":[{"type":"quiz","q":"Что будет выведено?","code":"const [a, , b] = [1, 2, 3];\nconsole.log(a + b);","opts":["4","3","6","NaN"],"exp":"Пустая позиция пропускает второй элемент: `a = 1`, `b = 3`, значит 1 + 3 = 4.","hint":"Обратите внимание на пустое место между запятыми."},{"type":"quiz","q":"Что будет выведено?","code":"const o = { x: 1, y: 2 };\nconst p = { ...o, y: 5 };\nconsole.log(p.y, o.y);","opts":["5 2","5 5","2 5","2 2"],"exp":"Spread копирует `o` в новый объект, затем `y: 5` перезаписывает значение только в копии. Исходный `o` не меняется.","hint":"Последующие свойства побеждают; spread делает копию."},{"type":"code","q":"Напишите `merge(a, b)`, которая объединяет два массива без дубликатов, сохраняя порядок первого появления.","fn":"merge(a, b)","starter":"function merge(a, b) {\n  \n}","tests":[{"e":"merge([1, 2], [2, 3])","v":[1,2,3]},{"e":"merge([], [])","v":[]},{"e":"merge([\"a\", \"b\"], [\"b\", \"a\", \"c\"])","v":["a","b","c"]}],"solution":"function merge(a, b) {\n  return [...new Set([...a, ...b])];\n}","exp":"Разверните оба массива в один, передайте его в `Set` (он убирает дубликаты и сохраняет порядок вставки), затем разверните Set обратно в массив.","hint":"`Set` автоматически удаляет дубликаты."}]},
{"tier":2,"icon":"🏛️","title":"Классы и this","brief":"Классы — это чертежи объектов. `constructor` выполняется при `new`, а методы обращаются к экземпляру через `this`.","tasks":[{"type":"order","q":"Соберите из строк корректный класс `Dog`.","lines":["class Dog {","  constructor(name) {","    this.name = name;","  }","  speak() {","    return this.name + \" лает\";","  }","}"],"exp":"Тело класса содержит `constructor` и методы. `this.name = name` сохраняет данные в новом экземпляре, чтобы методы могли использовать их позже.","hint":"Конструктор обычно идёт первым."},{"type":"quiz","q":"Что будет выведено?","code":"class Counter {\n  count = 0;\n  inc() {\n    this.count++;\n    return this;\n  }\n}\nconst c = new Counter();\nc.inc().inc().inc();\nconsole.log(c.count);","opts":["3","1","undefined","TypeError"],"exp":"Каждый `inc()` возвращает `this` (тот же экземпляр), поэтому вызовы можно объединять в цепочку. Три вызова → `count` равен 3.","hint":"Что возвращает `inc`?"},{"type":"code","q":"Допишите класс `Stack`: `push(x)`, `pop()` (удаляет и возвращает верхний элемент), `peek()` (возвращает верхний элемент) и геттер `size`.","fn":"class Stack","starter":"class Stack {\n  constructor() {\n    this.items = [];\n  }\n  push(x) {\n    \n  }\n  pop() {\n    \n  }\n  peek() {\n    \n  }\n  get size() {\n    \n  }\n}","tests":[{"t":"s.push(1); s.push(2); s.pop()","e":"(() => { const s = new Stack(); s.push(1); s.push(2); return s.pop(); })()","v":2},{"t":"s.push(\"a\"); s.push(\"b\"); s.peek()","e":"(() => { const s = new Stack(); s.push(\"a\"); s.push(\"b\"); return s.peek(); })()","v":"b"},{"t":"s.push(1); s.push(2); s.pop(); s.size","e":"(() => { const s = new Stack(); s.push(1); s.push(2); s.pop(); return s.size; })()","v":1},{"t":"new Stack().pop()","e":"new Stack().pop()","v":undefined}],"solution":"class Stack {\n  constructor() {\n    this.items = [];\n  }\n  push(x) {\n    this.items.push(x);\n  }\n  pop() {\n    return this.items.pop();\n  }\n  peek() {\n    return this.items[this.items.length - 1];\n  }\n  get size() {\n    return this.items.length;\n  }\n}","exp":"Каждый метод делегирует работу внутреннему массиву через `this.items`. Аксессор `get` позволяет читать `s.size` как свойство, без скобок.","hint":"Используйте `this.items.push`, `this.items.pop` и `this.items.length`."}]},
{"tier":2,"icon":"👑","title":"Решающая схватка адепта","boss":true,"time":300,"brief":"Функции высшего порядка, замыкания, классы и деструктуризация. Этот уровень кусается — сортируйте осторожно.","tasks":[{"type":"quiz","q":"Что будет выведено?","code":"console.log([3, 1, 10, 2].sort());","opts":["[1, 10, 2, 3]","[1, 2, 3, 10]","[10, 3, 2, 1]","[3, 1, 10, 2]"],"exp":"Без функции сравнения `sort` превращает элементы в строки и сортирует по алфавиту: \"10\" идёт раньше \"2\". Для чисел используйте `sort((a, b) => a - b)`.","hint":"Сортировка по умолчанию сравнивает элементы как строки."},{"type":"code","q":"Напишите `groupBy(arr, fn)`, которая группирует элементы в объект по ключу `fn(item)`.","fn":"groupBy(arr, fn)","starter":"function groupBy(arr, fn) {\n  const groups = {};\n  \n  return groups;\n}","tests":[{"e":"groupBy([1, 2, 3, 4], n => n % 2 === 0 ? \"even\" : \"odd\")","v":{"odd":[1,3],"even":[2,4]}},{"e":"groupBy([\"apple\", \"avocado\", \"banana\"], s => s[0])","v":{"a":["apple","avocado"],"b":["banana"]}},{"e":"groupBy([], x => x)","v":{}}],"solution":"function groupBy(arr, fn) {\n  const groups = {};\n  for (const item of arr) {\n    const key = fn(item);\n    (groups[key] ??= []).push(item);\n  }\n  return groups;\n}","exp":"Для каждого элемента вычислите ключ, создайте группу, если её нет, и добавьте элемент. `??=` присваивает, только если слева null или undefined. (В современном JS есть и `Object.groupBy`.)","hint":"`if (!groups[key]) groups[key] = [];`, затем push."},{"type":"fill","q":"Соберите все оставшиеся свойства в `rest`.","code":"const user = { name: \"Ada\", age: 36, lang: \"JS\" };\nconst { name, ___rest } = user;\n// rest → { age: 36, lang: \"JS\" }","answers":["..."],"exp":"В деструктуризации `...rest` собирает все оставшиеся свойства в новый объект. Те же три точки, что и у spread, — но работа обратная.","hint":"Три символа, как у spread."},{"type":"quiz","q":"Что будет выведено?","code":"let x = 1;\nfunction show() {\n  console.log(x);\n}\nfunction run() {\n  let x = 2;\n  show();\n}\nrun();","opts":["1","2","undefined","ReferenceError"],"exp":"В JavaScript лексическая область видимости: `show` видит переменные там, где она НАПИСАНА, а не там, где вызвана. Внешняя `x` равна 1.","hint":"Область видимости определяется местом объявления функции."}]},
{"tier":3,"icon":"⏳","title":"Асинхронность и промисы","brief":"JavaScript однопоточный, но неблокирующий. Промисы представляют будущие значения, а `async`/`await` позволяет работать с ними как с обычным кодом.","tasks":[{"type":"quiz","q":"В каком порядке будут выведены буквы?","code":"console.log(\"A\");\nsetTimeout(() => console.log(\"B\"), 0);\nPromise.resolve().then(() => console.log(\"C\"));\nconsole.log(\"D\");","opts":["A D C B","A B C D","A C D B","A D B C"],"exp":"Сначала выполняется синхронный код (A, D). Затем очередь микрозадач (колбэки промисов → C) опустошается до следующей макрозадачи (setTimeout → B).","hint":"Колбэки промисов — микрозадачи, таймеры — макрозадачи."},{"type":"fill","q":"Дождитесь завершения запроса.","code":"async function getUser(url) {\n  const res = ___ fetch(url);\n  return res.json();\n}","answers":["await"],"exp":"`await` приостанавливает async-функцию до выполнения промиса и отдаёт его значение — не блокируя остальную страницу.","hint":"Работает только внутри `async`-функций."},{"type":"code","q":"Напишите `async sumAll(list)` — в `list` вперемешку промисы и обычные числа. Верните (через промис) их сумму.","fn":"async sumAll(list)","starter":"async function sumAll(list) {\n  \n}","tests":[{"e":"sumAll([Promise.resolve(1), 2, Promise.resolve(3)])","v":6},{"e":"sumAll([])","v":0},{"e":"sumAll([1]) instanceof Promise","v":true}],"solution":"async function sumAll(list) {\n  const values = await Promise.all(list);\n  return values.reduce((a, b) => a + b, 0);\n}","exp":"`Promise.all` ждёт каждый элемент (обычные значения считаются уже выполненными) и отдаёт массив результатов. `async`-функция всегда возвращает промис.","hint":"`await Promise.all(list)`, затем reduce."}]},

   ===================================================================== */
async function execCore(code, exprs) {

    }

  catch (err) { return { error: (err && err.name || 'Error') + ': ' + (err && err.message || err), logs }; }
  const results = [];
  for (const f of fns) {
    try { results.push({ ok: true, value: pack(await f(), 0) }); }
    catch (err) { results.push({ ok: false, error: (err && err.name || 'Error') + ': ' + (err && err.message || err) }); }
  }
  return { results, logs };
}

self.onmessage = async (e) => { const r = await execCore(e.data.code, e.data.exprs); try { self.postMessage(r); } catch (err) { self.postMessage({ error: 'Не удалось прочитать результат: ' + err.message, logs: [] }); } };
self.postMessage({ ready: true });`;
let workerURL = null;
function runCode(code, exprs) {
  return new Promise(resolve => {

const norm = s => s.replace(/\s+/g, '');

  if (!run || run.sheet) return;

  if (T.type === 'quiz') {
    if (run.cur.sel == null) return;
    const ok = run.cur.sel === 0;
    $('#opts').classList.add('locked');
    $$('.opt').forEach(b => { const k = +b.dataset.k; if (k === 0) b.classList.add('right'); else if (k === run.cur.sel) b.classList.add('wrong'); b.classList.remove('sel'); });
    ok ? onCorrect() : onWrong(`<p style="margin-bottom:6px">Ответ: <code>${esc(T.opts[0])}</code></p>`);
  } else if (T.type === 'fill') {
    const inp = $('#blank'), v = inp.value; if (!v.trim()) return;
    const ok = T.answers.some(a => norm(a) === norm(v));
    inp.classList.add(ok ? 'right' : 'wrong'); inp.disabled = true;
    ok ? onCorrect() : onWrong(`<p style="margin-bottom:6px">Ответ: <code>${esc(T.answers[0])}</code></p>`);
  } else if (T.type === 'order') {
    if (run.cur.pool.length) return;

    $$('#placed .ln').forEach((el, p) => { el.classList.add(T.lines[placed[p]] === T.lines[p] ? 'right' : 'wrong'); el.style.pointerEvents = 'none'; });
    $('#pool').innerHTML = '';

}

  c.fillStyle = gold; c.beginPath(); c.moveTo(W / 2, 420); c.lineTo(W / 2 + 10, 430); c.lineTo(W / 2, 440); c.lineTo(W / 2 - 10, 430); c.closePath(); c.fill();

  // name

  c.strokeStyle = g; c.lineWidth = 3; c.beginPath(); c.moveTo(W / 2 - 560, 668); c.lineTo(W / 2 + 560, 668); c.stroke();

  const lines = wrapLines(c, body, 1320); let y = 738;
  lines.forEach(l => { c.fillText(l, W / 2, y); y += 50; });
  const stars = totalStars(), hon = honor(stars);
  if (hon) { c.fillStyle = gold; c.font = `italic 600 40px ${serif}`; c.fillText('— ' + hon + ' —', W / 2, y + 22); y += 60; }
  // stats
  c.fillStyle = navy; c.font = `bold 26px ${sans}`;
  spaced(c, `★ ${stars} / ${MAX_STARS} ЗВЁЗД     •     ${fmtNum(totalXP())} XP     •     ${LEVELS.length} / ${LEVELS.length} УРОВНЕЙ`, W / 2, Math.max(y + 34, 990), 3);
  // seal ribbons
  const sx = W / 2, sy = 1172;
  c.fillStyle = navy;
  c.beginPath(); c.moveTo(sx - 70, sy + 40); c.lineTo(sx - 20, sy + 60); c.lineTo(sx - 55, sy + 145); c.lineTo(sx - 78, sy + 120); c.lineTo(sx - 108, sy + 133); c.closePath(); c.fill();
  c.fillStyle = '#8c2f39';
  c.beginPath(); c.moveTo(sx + 70, sy + 40); c.lineTo(sx + 20, sy + 60); c.lineTo(sx + 55, sy + 145); c.lineTo(sx + 78, sy + 120); c.lineTo(sx + 108, sy + 133); c.closePath(); c.fill();

  c.shadowColor = 'rgba(0,0,0,.25)'; c.shadowBlur = 18; c.shadowOffsetY = 6;
  g = c.createRadialGradient(-30, -30, 10, 0, 0, 115); g.addColorStop(0, '#f5dc8a'); g.addColorStop(.6, '#d4a53c'); g.addColorStop(1, '#a87a1f');
  c.fillStyle = g; c.beginPath();

  c.strokeStyle = 'rgba(255,248,220,.85)'; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, 80, 0, Math.PI * 2); c.stroke();
  c.lineWidth = 1.2; c.beginPath(); c.arc(0, 0, 72, 0, Math.PI * 2); c.stroke();
  c.fillStyle = '#5a3d06'; c.font = `bold 17px ${sans}`; spaced(c, 'JS ODYSSEY', 0, -22, 2);
  c.font = `28px ${sans}`; c.fillText('★ ★ ★', 0, 16);
  c.font = `bold 17px ${sans}`; spaced(c, 'ПРОЙДЕНО', 0, 44, 2);
  c.restore();
  // date & id
  const date = new Date(save.completedAt || Date.now()).toLocaleDateString('ru-RU', { year: 'numeric', month: 'long', day: 'numeric' });
  for (const [x, val, label] of [[520, date, 'ДАТА ЗАВЕРШЕНИЯ'], [W - 520, save.certId || '—', 'НОМЕР СЕРТИФИКАТА']]) {

    c.strokeStyle = navy; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x - 210, 1202); c.lineTo(x + 210, 1202); c.stroke();

}
function certFileName(ext) { const slug = (save.name || 'certificate').trim().replace(/[^\p{L}\p{N}\- ]+/gu, '').replace(/\s+/g, '-') || 'certificate'; return `JS-Odyssey-Сертификат-${slug}.${ext}`; }
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function needName() {
  if ((save.name || '').trim()) return false;
  sfx.locked(); toast('✍️ Сначала введите имя'); const i = $('#certName'); i && i.focus(); return true;
}
function downloadPNG() {
  if (needName()) return;
  const cv = $('#certCanvas'); drawCert(cv, save.name);
  cv.toBlob(b => { downloadBlob(b, certFileName('png')); sfx.unlock(); toast('⬇ Сертификат сохранён в PNG'); }, 'image/png');
}
function downloadPDF() {
  if (needName()) return;
  const cv = $('#certCanvas'); drawCert(cv, save.name);
  const bin = atob(cv.toDataURL('image/jpeg', .93).split(',')[1]);
  const img = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) img[k] = bin.charCodeAt(k);
  const enc = s => new TextEncoder().encode(s), PW = 842, PH = 595;
  const chunks = [], offs = []; let len = 0;
  const push = u => { chunks.push(u); len += u.length; };
  const obj = (n, body) => { offs[n] = len; push(enc(`${n} 0 obj\n${body}\nendobj\n`)); };
  push(enc('%PDF-1.4\n')); push(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4] = len; push(enc(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`)); push(img); push(enc('\nendstream\nendobj\n'));
  const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  obj(6, '<< /Title (JS Odyssey Certificate of Achievement) /Producer (JS Odyssey) >>');
  const xref = len;
  let x = 'xref\n0 7\n0000000000 65535 f \n';
  for (let n = 1; n <= 6; n++) x += String(offs[n]).padStart(10, '0') + ' 00000 n \n';
  x += `trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  push(enc(x));
  downloadBlob(new Blob(chunks, { type: 'application/pdf' }), certFileName('pdf'));
  sfx.unlock(); toast('⬇ Сертификат сохранён в PDF');
}

/* =====================================================================
   EVENTS
   ===================================================================== */
const SILENT = new Set(['opt', 'check', 'run', 'cont', 'hint', 'node', 'place', 'unplace', 'close-modal-bg', 'dl-png', 'dl-pdf', 'next', 'retry', 'start']);
const ACT = {
  play: () => { closeModal(); showMap(); },
  title: () => showTitle(),
  settings: () => openSettings(),
  cert: () => { closeModal(); showCertificate(); },
  'cert-close': () => { closeModal(); showCertificate(); },
  node: el => {
    const i = +el.dataset.i;
    if (!isUnlocked(i)) { sfx.locked(); el.parentElement.classList.remove('shake'); void el.offsetWidth; el.parentElement.classList.add('shake'); toast('🔒 Сначала пройдите предыдущий уровень'); return; }
    sfx.select(); openIntro(i);
  },
  start: el => { sfx.unlock(); closeModal(); startLevel(+el.dataset.i); },
  next: el => { sfx.click(); const i = +el.dataset.i; closeModal(); showMap(i); setTimeout(() => openIntro(i), 450); },
  retry: el => { sfx.click(); const i = +el.dataset.i; closeModal(); startLevel(i); },
  map: () => { closeModal(); showMap(); },
  quit: () => {

    openModal(`<div><div class="f-ico">🚪</div><h2>Покинуть уровень?</h2><p>Прогресс на этом уровне будет потерян.</p>
      <div class="m-btns"><button class="btn ghost" data-act="close-modal">Остаться</button><button class="btn bad" data-act="map">Выйти</button></div></div>`,
      { onClose: () => { if (run) run.paused = run.sheet; } });
  },
  'close-modal': () => closeModal(),
  'close-modal-bg': (el, e) => { if (e.target === el) { sfx.click(); closeModal(); } },
  opt: el => {
    if (!run || run.sheet) return;
    sfx.select();
    $$('.opt').forEach(b => b.classList.remove('sel')); el.classList.add('sel');
    run.cur.sel = +el.dataset.k; $('#checkBtn').disabled = false;
  },
  check: () => doCheck(),
  run: () => runTests(),
  cont: () => { sfx.click(); continueNext(); },
  hint: () => showHint(),
  place: el => { if (run.sheet) return; sfx.select(); const j = +el.dataset.j; run.cur.placed.push(run.cur.pool.splice(j, 1)[0]); renderOrder(); },
  unplace: el => { if (run.sheet) return; tone(440, { dur: .07, type: 'triangle', vol: .1, slide: 330 }); const p = +el.dataset.p; run.cur.pool.push(run.cur.placed.splice(p, 1)[0]); renderOrder(); },
  'reset-code': () => { if (editor && !run.sheet) { editor.set(run.cur.T.starter); renderTests(); } },
  solution: () => {
    if (!editor || run.sheet) return;
    editor.set(run.cur.T.solution);
    if (!run.cur.usedSolution) { run.cur.usedSolution = true; run.hints += 2; }
    sfx.hint(); toast('Решение загружено — разберитесь в нём и запустите тесты.', 3000);
  },
  'toggle-sfx': el => { save.sfx = !save.sfx; persist(); el.classList.toggle('on', save.sfx); sfx.select(); },
  'toggle-music': el => { save.music = !save.music; persist(); el.classList.toggle('on', save.music); save.music ? Music.start() : Music.stop(); },
  reset: () => openModal(`<div><div class="f-ico">⚠️</div><h2>Сбросить весь прогресс?</h2><p>Звёзды, XP и открытые уровни будут удалены. Это нельзя отменить.</p>
    <div class="m-btns"><button class="btn ghost" data-act="close-modal">Отмена</button><button class="btn bad" data-act="reset-yes">Удалить</button></div></div>`),
  'reset-yes': () => { const keep = { sfx: save.sfx, music: save.music }; save = Object.assign(freshSave(), keep); persist(); closeModal(); showTitle(); toast('Прогресс сброшен'); },
  'dl-png': () => downloadPNG(),
  'dl-pdf': () => downloadPDF(),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; if (!ACT[act]) return;
  if (el.disabled) return;
  if (!SILENT.has(act)) sfx.click();
  ACT[act](el, e);
});
document.addEventListener('pointerdown', e => {
  const k = e.target.closest('.key'); if (!k) return;
  e.preventDefault(); insertKey(k.dataset.key);
});
let lastHover = null;
document.addEventListener('mouseover', e => {
  const el = e.target.closest('.opt,.node,.ln,.btn:not(:disabled)'); if (el === lastHover) return; lastHover = el;
  if (el && matchMedia('(hover:hover)').matches) sfx.hover();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalOpen()) { if (modalDismiss) closeModal(); return; }
  if (!run || modalOpen()) return;
  const tag = e.target.tagName;
  if (tag === 'TEXTAREA' || tag === 'BUTTON') return;
  if (run.sheet) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); continueNext(); } return; }
  const T = run.cur && run.cur.T; if (!T) return;
  if (T.type === 'quiz' && /^[1-9]$/.test(e.key)) { const b = $$('.opt')[+e.key - 1]; if (b) ACT.opt(b); return; }
  if (e.key === 'Enter' && !e.repeat) { e.preventDefault(); T.type === 'code' ? runTests() : doCheck(); }
